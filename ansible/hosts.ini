[lab_systems]
localhost ansible_connection=ssh ansible_host=127.0.0.1 ansible_port=4089 ansible_user=rolando

[lab_systems:vars]
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519_tp4
ansible_ssh_common_args='-o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts_tp4'
