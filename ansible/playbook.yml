---
- name: Desplegar el analizador de tráfico del campus
  hosts: lab_systems
  become: true
  vars:
    project_dir: /opt/tp4-9389
    report_host: localhost
  tasks:
    - name: Instalar Docker y Compose
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Habilitar e iniciar Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Crear el directorio de despliegue
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Copiar Dockerfile, Compose y configuración de GoAccess
      ansible.builtin.copy:
        src: "../docker/{{ item }}"
        dest: "{{ project_dir }}/{{ item }}"
        mode: '0644'
      loop: [Dockerfile, docker-compose.yml, goaccess.conf]
      register: app_files

    - name: Copiar la configuración de Nginx
      ansible.builtin.copy:
        src: ../docker/nginx.conf
        dest: "{{ project_dir }}/nginx.conf"
        mode: '0644'
      notify: Reiniciar Nginx

    - name: Levantar los dos servicios
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        build: "{{ 'always' if app_files.changed else 'policy' }}"
        wait: true
      environment:
        REPORT_HOST: "{{ report_host }}"

  handlers:
    - name: Reiniciar Nginx
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: restarted
        services: [web_server]
      environment:
        REPORT_HOST: "{{ report_host }}"
