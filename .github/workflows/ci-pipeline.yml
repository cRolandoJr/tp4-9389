name: Validar configuración
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyYAML
        run: python -m pip install pyyaml
      - name: Validar Compose
        run: python -m unittest tests/test_config.py
