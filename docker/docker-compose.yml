name: tp4-9389
services:
  web_server:
    image: docker.io/library/nginx:stable-alpine
    ports:
      - "8089:80"
      - "9089:90"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - access_logs:/srv/logs
      # GoAccess inicializa los permisos del volumen de reportes.
      - type: volume
        source: reports
        target: /srv/reports
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  log_analyzer:
    build: .
    command: ["--ws-url=ws://${REPORT_HOST:-localhost}:9089/ws"]
    depends_on:
      web_server:
        condition: service_healthy
    volumes:
      - ./goaccess.conf:/etc/goaccess/goaccess.conf:ro
      - access_logs:/srv/logs:ro
      - reports:/srv/reports
    restart: unless-stopped
volumes:
  access_logs:
  reports:
